<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Shopping Lists</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <style>
:root {
  --accent: #2e7d32;
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #1b1b1b;
  --muted: #8a8a8a;
  --line: #e4e4e4;
  --danger: #c62828;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #43a047;
    --bg: #121212;
    --card: #1e1e1e;
    --fg: #ececec;
    --muted: #8a8a8a;
    --line: #2c2c2c;
    --danger: #ef5350;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font: 18px/1.3 system-ui, -apple-system, Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  -webkit-tap-highlight-color: transparent;
}

/* Header + add form stay on top while scrolling */
.top {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
header { display: flex; align-items: center; min-height: 54px; padding: 6px 4px 0 16px; }
#homeView header { padding-bottom: 6px; }
h1 {
  flex: 1; margin: 0; font-size: 1.3rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#menuBtn, #backBtn {
  flex: none;
  border: 0; background: none; color: var(--fg);
  font-size: 1.6rem; width: 48px; height: 48px;
}
#backBtn { margin-left: -12px; font-size: 1.5rem; }

/* Home: lists of lists */
.lists .open {
  flex: 1;
  display: flex; align-items: center; gap: 12px;
  min-height: 64px;
  padding: 12px 4px 12px 16px;
  border: 0; background: none; color: inherit;
  font: inherit; text-align: left;
}
.lists .count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
.more {
  flex: none; width: 52px;
  border: 0; background: none; color: var(--muted);
  font-size: 1.4rem;
}
#homeView main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.bottom-bar button {
  display: block; width: 100%; max-width: 600px; margin: 0 auto;
  padding: 14px;
  border: 0; border-radius: 12px;
  background: var(--accent); color: #fff;
  font: inherit; font-weight: 600;
}

#addForm { display: flex; gap: 8px; padding: 6px 12px 12px; }
#addForm input {
  min-width: 0;
  font: inherit;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: inherit;
}
#nameInput { flex: 1; }
#qtyInput { width: 5.5em; }
#addForm button {
  flex: none; width: 48px;
  border: 0; border-radius: 10px;
  background: var(--accent); color: #fff;
  font-size: 1.7rem; line-height: 1;
}

main { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

/* List rows */
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  transition: opacity .3s ease, background-color .2s ease, scale .35s ease,
              box-shadow .2s ease, border-radius .2s ease;
}
.lists li { user-select: auto; -webkit-user-select: auto; }
.handle {
  display: flex; align-items: center;
  padding: 0 4px 0 14px;
  color: var(--muted);
  font-size: 1.2rem;
  opacity: .6;
  touch-action: none;       /* lets us drag instead of scrolling */
  cursor: grab;
}
.toggle {
  flex: 1;
  display: flex; align-items: center; gap: 12px;
  min-height: 56px;
  padding: 12px 4px 12px 8px;
  border: 0; background: none; color: inherit;
  font: inherit; text-align: left;
  cursor: pointer;
}
.name { flex: 1; overflow-wrap: anywhere; }
/* The strike-through is drawn as a line that sweeps across the text. */
.name .txt {
  background: linear-gradient(currentColor, currentColor) no-repeat 0 55% / 0 2px;
  transition: background-size .3s cubic-bezier(.2, .8, .2, 1);
}
.qty { color: var(--muted); white-space: nowrap; }
.edit {
  border: 0; background: none; color: var(--muted);
  font-size: 1.15rem; padding: 0 16px;
}

/* Ticked-off items */
.list li.is-done { opacity: .5; }
.list li.is-done .name .txt { background-size: 100% 2px; }

h2 {
  margin: 28px 16px 8px;
  font-size: .8rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted);
}
.hint { margin: 0; padding: 28px 16px; text-align: center; color: var(--muted); }

/* Holding a row: it sinks slightly, then lifts when the drag starts. */
.list li.pressing {
  background: color-mix(in srgb, var(--fg) 6%, var(--card));
  scale: .98;
}
.list.sorting li { transition: translate .25s cubic-bezier(.2, .8, .2, 1), opacity .3s ease; }
.list li.dragging,
.list li.settling {
  z-index: 1;
  opacity: 1;
  border-radius: 12px;
  border-bottom-color: transparent;
}
.list li.dragging {
  scale: 1.03;
  box-shadow: 0 12px 28px rgba(0, 0, 0, .22), 0 2px 6px rgba(0, 0, 0, .12);
  transition: scale .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s ease, border-radius .2s ease;
  cursor: grabbing;
}
.list li.settling {
  transition: translate .2s cubic-bezier(.2, .8, .2, 1), scale .2s ease, box-shadow .2s ease, border-radius .2s ease;
}

li.flash { animation: flash 1.2s ease-out; }
@keyframes flash {
  from { background: color-mix(in srgb, var(--accent) 35%, var(--card)); }
}

/* Snackbar (Undo) */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex; align-items: center; gap: 12px;
  max-width: calc(100vw - 32px);
  padding: 6px 6px 6px 18px;
  border-radius: 14px;
  background: #323232; color: #fff;
  font-size: .95rem;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  translate: -50% 150%;
  opacity: 0;
  pointer-events: none;
  transition: translate .35s cubic-bezier(.2, .8, .2, 1), opacity .25s ease;
}
.toast.show { translate: -50% 0; opacity: 1; pointer-events: auto; }
#toastText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toastBtn {
  flex: none;
  border: 0; border-radius: 10px; background: none;
  color: #81c784; font: inherit; font-weight: 700;
  padding: 10px 12px;
}

/* Dialogs */
dialog {
  width: min(92vw, 420px);
  border: 0; border-radius: 16px;
  padding: 20px;
  background: var(--card); color: var(--fg);
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog[open] { animation: dialog-in .22s cubic-bezier(.2, .8, .2, 1); }
dialog[open]::backdrop { animation: fade-in .22s ease; }
@keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes fade-in { from { opacity: 0; } }
dialog h3 { margin: 0 0 16px; }
dialog label { display: block; margin-bottom: 14px; font-size: .9rem; color: var(--muted); }
dialog input {
  display: block; width: 100%; margin-top: 4px;
  font: inherit; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg);
}
dialog button {
  font: inherit; padding: 10px 14px;
  border: 0; border-radius: 10px;
  background: var(--line); color: var(--fg);
}
dialog .primary { background: var(--accent); color: #fff; }
dialog .danger { background: none; color: var(--danger); }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.actions.column { flex-direction: column; }
dialog .note { margin: 0; font-size: .95rem; color: var(--muted); }
.spacer { flex: 1; }
#menuDialog button, #listMenuDialog button { display: block; width: 100%; margin-bottom: 8px; text-align: left; }
#menuDialog button:last-child { margin-bottom: 0; text-align: center; }
#listMenuDialog h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#listMenuDialog .danger { background: var(--line); margin-bottom: 0; }
</style>
</head>
<body>
  <!-- Home: all lists -->
  <section id="homeView">
    <div class="top">
      <header>
        <h1>Shopping Lists</h1>
      </header>
    </div>
    <main>
      <ul id="listsList" class="list lists"></ul>
      <p id="noLists" class="hint">No lists yet.</p>
    </main>
    <div class="bottom-bar">
      <button id="newListBtn">+ New list</button>
    </div>
  </section>

  <!-- One list -->
  <section id="listView" hidden>
    <div class="top">
      <header>
        <button id="backBtn" aria-label="Back">←</button>
        <h1 id="listTitle"></h1>
        <button id="menuBtn" aria-label="Menu">⋮</button>
      </header>
      <form id="addForm" autocomplete="off">
        <input id="nameInput" placeholder="Item" enterkeyhint="done" aria-label="Item">
        <input id="qtyInput" placeholder="Qty" enterkeyhint="done" aria-label="Quantity">
        <button type="submit" aria-label="Add">+</button>
      </form>
    </div>
    <main id="listMain">
      <ul id="todoList" class="list"></ul>
      <p id="emptyMsg" class="hint"></p>
      <h2 id="doneHeader">Done · <span id="doneCount">0</span></h2>
      <ul id="doneList" class="list done"></ul>
    </main>
  </section>

  <!-- Popups -->
  <dialog id="listMenuDialog">
    <form method="dialog">
      <h3 id="listMenuTitle"></h3>
      <button value="rename">Rename</button>
      <button value="remove" class="danger">Remove</button>
    </form>
  </dialog>

  <dialog id="nameDialog">
    <form method="dialog">
      <h3 id="nameDialogTitle"></h3>
      <label>Name <input id="listNameInput" required pattern=".*\S.*" enterkeyhint="done"></label>
      <div class="actions">
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" class="primary" id="nameDialogOk"></button>
      </div>
    </form>
  </dialog>

  <dialog id="editDialog">
    <form method="dialog">
      <h3>Edit item</h3>
      <label>Item <input id="editName" required></label>
      <label>Quantity <input id="editQty"></label>
      <div class="actions">
        <button type="button" id="deleteBtn" class="danger">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="menuDialog">
    <form method="dialog">
      <button value="untickAll">↺ Untick</button>
      <button type="button" id="importBtn">Import CSV</button>
      <button type="button" id="exportBtn">Export CSV</button>
      <button value="cancel">Close</button>
    </form>
  </dialog>

  <dialog id="importDialog">
    <form method="dialog">
      <h3>Import <span id="importCount"></span> items</h3>
      <p class="note">This list already has items. Items with the same name keep their place and get the new quantity.</p>
      <div class="actions column">
        <button value="replace" class="primary">Replace this list</button>
        <button value="add">Add to this list</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastBtn" type="button"></button>
  </div>

  <input type="file" id="fileInput" hidden>

  <script>
'use strict';

/*
 * Data: { lists: [ { id, name, items: [ { id, name, qty, done } ] } ] }
 *
 * Inside a list, `items` is ONE array whose order is each item's permanent position.
 * Ticking an item only flips `done`; it never moves in the array.
 * The screen shows unticked items (in array order) and then ticked items (in array order),
 * so unticking an item puts it straight back where it was.
 */

const KEY = 'shopping-lists-v2';
const OLD_KEY = 'shopping-list-v1'; // single-list version
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sameName = (a, b) => a.toLowerCase() === b.toLowerCase();

let data = load();
let current = null; // the open list, or null on the home screen
let items = [];     // current.items
if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(data)); // keep migrated ids stable

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.lists)) return d;
  } catch { /* fall through */ }

  // First run of the multi-list version: bring over the old single list.
  const d = { lists: [] };
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (Array.isArray(old) && old.length) d.lists.push({ id: uid(), name: 'Shopping list', items: old });
  } catch { /* nothing to migrate */ }
  return d;
}

function save() {
  if (current) current.items = items;
  localStorage.setItem(KEY, JSON.stringify(data));
}

const byId = (id) => items.find((it) => it.id === id);

function flash(id) {
  const li = document.querySelector(`li[data-id="${id}"]`);
  if (!li) return;
  li.classList.add('flash');
  li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  li.addEventListener('animationend', () => li.classList.remove('flash'), { once: true });
}

// ---------- Navigation (#list/<id> = a list, otherwise home) ----------
// Using the URL hash means the phone's back button returns to the home screen.

function route() {
  const m = location.hash.match(/^#list\/(.+)$/);
  const list = m && data.lists.find((l) => l.id === decodeURIComponent(m[1]));
  current = list || null;
  items = list ? list.items : [];
  $('homeView').hidden = !!list;
  $('listView').hidden = !list;
  if (list) {
    $('listTitle').textContent = list.name;
    document.title = list.name;
    render({ animate: false });
  } else {
    document.title = 'Shopping Lists';
    renderHome();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

function openList(id) {
  history.pushState({ fromHome: true }, '', `#list/${encodeURIComponent(id)}`);
  route();
}

function goHome() {
  if (history.state?.fromHome) {
    history.back(); // so the phone's back button doesn't return to the list
  } else {
    history.replaceState(null, '', location.pathname);
    route();
  }
}
$('backBtn').addEventListener('click', goHome);

// ---------- Home screen ----------

function summary(list) {
  const total = list.items.length;
  const left = list.items.filter((it) => !it.done).length;
  const word = (n) => (n === 1 ? 'item' : 'items');
  if (!total) return 'Empty';
  if (left === total) return `${total} ${word(total)}`;
  return `${left} to buy · ${total} ${word(total)}`;
}

function listRow(list) {
  const li = document.createElement('li');
  li.dataset.id = list.id;
  li.innerHTML = `
    <button class="open"><span class="name"></span><span class="count"></span></button>
    <button class="more" aria-label="List options">⋮</button>`;
  li.querySelector('.name').textContent = list.name;
  li.querySelector('.count').textContent = summary(list);
  return li;
}

function renderHome() {
  $('listsList').replaceChildren(...data.lists.map(listRow));
  $('noLists').hidden = data.lists.length > 0;
}

let menuList = null;
const listMenuDialog = $('listMenuDialog');

$('listsList').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  const list = li && data.lists.find((l) => l.id === li.dataset.id);
  if (!list) return;
  if (e.target.closest('.more')) {
    menuList = list;
    $('listMenuTitle').textContent = list.name;
    listMenuDialog.returnValue = '';
    listMenuDialog.showModal();
  } else if (e.target.closest('.open')) {
    openList(list.id);
  }
});

listMenuDialog.addEventListener('close', () => {
  const list = menuList;
  menuList = null;
  if (!list) return;
  if (listMenuDialog.returnValue === 'rename') {
    askName('rename', list);
  } else if (listMenuDialog.returnValue === 'remove') {
    if (!confirm(`Remove the list "${list.name}"?`)) return;
    data.lists = data.lists.filter((l) => l !== list);
    save();
    renderHome();
  }
});

// New list / rename: one small popup that only asks for the name.
const nameDialog = $('nameDialog');
let naming = null; // { mode: 'create' | 'rename', list }

function askName(mode, list = null) {
  naming = { mode, list };
  $('nameDialogTitle').textContent = mode === 'create' ? 'New list' : 'Rename list';
  $('nameDialogOk').textContent = mode === 'create' ? 'Create' : 'Save';
  $('listNameInput').value = list ? list.name : '';
  nameDialog.returnValue = '';
  nameDialog.showModal();
  $('listNameInput').focus();
}

$('newListBtn').addEventListener('click', () => askName('create'));

nameDialog.addEventListener('close', () => {
  const name = $('listNameInput').value.trim();
  if (nameDialog.returnValue === 'ok' && name && naming) {
    if (naming.mode === 'create') {
      const list = { id: uid(), name, items: [] };
      data.lists.push(list);
      save();
      renderHome();
      flash(list.id);
    } else {
      naming.list.name = name;
      save();
      renderHome();
    }
  }
  naming = null;
});

// ---------- List screen ----------

const todoList = $('todoList');
const doneList = $('doneList');

const EASE = 'cubic-bezier(.2, .8, .2, 1)';
const rowEl = (id) => $('listMain').querySelector(`li[data-id="${CSS.escape(id)}"]`);

function row(item) {
  const li = document.createElement('li');
  li.dataset.id = item.id;
  li.classList.toggle('is-done', !!item.done);
  li.innerHTML = `
    <span class="handle" aria-hidden="true">⠿</span>
    <button class="toggle"><span class="name"><span class="txt"></span></span><span class="qty"></span></button>
    <button class="edit" aria-label="Edit">✎</button>`;
  li.querySelector('.toggle').setAttribute('aria-pressed', !!item.done);
  li.querySelector('.txt').textContent = item.name;
  li.querySelector('.qty').textContent = item.qty;
  return li;
}

// Everything that can shift position when the list changes.
const flipTargets = () => document.querySelectorAll('#listMain li[data-id], #emptyMsg, #doneHeader');
const flipKey = (el) => el.dataset.id || el.id;

// Re-draws the list. Unless animate is false, every row slides from where it
// was to where it is now (FLIP), and `enter` (an item id) animates in.
function render({ animate = true, enter = null } = {}) {
  clearTimeout(renderTimer);
  renderTimer = 0;
  cancelPress();
  const flip = animate && !$('listView').hidden && !drag;
  const before = new Map();
  if (flip) {
    for (const el of flipTargets()) if (!el.hidden) before.set(flipKey(el), el.getBoundingClientRect().top);
  }

  const todo = items.filter((it) => !it.done);
  const done = items.filter((it) => it.done);
  todoList.replaceChildren(...todo.map(row));
  doneList.replaceChildren(...done.map(row));

  $('doneCount').textContent = done.length;
  $('doneHeader').hidden = done.length === 0;
  $('emptyMsg').hidden = todo.length > 0;
  $('emptyMsg').textContent = items.length ? 'Nothing left to buy' : 'Add something to buy above.';

  if (!flip) return;
  for (const el of flipTargets()) {
    if (el.hidden) continue;
    const key = flipKey(el);
    if (key === enter) {
      el.animate(
        [{ opacity: 0, transform: 'translateY(-14px) scale(.96)' }, { opacity: 1, transform: 'none' }],
        { duration: 380, easing: EASE }
      );
    } else if (before.has(key)) {
      const dy = before.get(key) - el.getBoundingClientRect().top;
      if (Math.abs(dy) < 1) continue;
      // Rows travelling far (between sections) glide over the others.
      const far = Math.abs(dy) > el.offsetHeight * 1.5;
      if (far) el.style.zIndex = 1;
      el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: far ? 450 : 320, easing: EASE })
        .finished.then(() => { el.style.zIndex = ''; }, () => {});
    } else {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' });
    }
  }
}

// Ticking first strikes the item through in place; a moment later the list
// re-sorts. Ticking several items quickly moves them all together.
let renderTimer = 0;
function scheduleRender(delay = 450) {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(function fire() {
    if (press || drag) { renderTimer = setTimeout(fire, 150); return; } // finger still down
    render();
  }, delay);
}
function flushRender() {
  if (renderTimer) render();
}

function toggle(item) {
  item.done = !item.done;
  save();
  const li = rowEl(item.id);
  if (li) {
    li.classList.toggle('is-done', item.done);
    li.querySelector('.toggle').setAttribute('aria-pressed', item.done);
  }
  scheduleRender();
}

// Deleting slides the row away and offers Undo instead of asking first.
async function removeItem(item) {
  flushRender();
  const list = current;
  const index = items.indexOf(item);
  if (index < 0) return;
  const li = rowEl(item.id);
  if (li) {
    li.style.overflow = 'hidden';
    await li.animate(
      [
        { height: `${li.offsetHeight}px`, opacity: 1, transform: 'none' },
        { height: '0px', opacity: 0, transform: 'translateX(-48px)', borderBottomWidth: '0px' },
      ],
      { duration: 280, easing: 'cubic-bezier(.4, 0, .6, 1)', fill: 'forwards' }
    ).finished.catch(() => {});
  }
  items = items.filter((it) => it !== item);
  save();
  render();
  showToast(`Deleted “${item.name}”`, 'Undo', () => {
    list.items.splice(Math.min(index, list.items.length), 0, item);
    if (list === current) items = list.items;
    localStorage.setItem(KEY, JSON.stringify(data));
    if (list === current) { render({ enter: item.id }); flash(item.id); }
    else if (!current) renderHome();
  });
}

// ---------- Toast (snackbar with an action) ----------

const toast = $('toast');
let toastTimer = 0;
let toastAction = null;

function showToast(text, actionLabel, action) {
  $('toastText').textContent = text;
  $('toastBtn').textContent = actionLabel;
  toastAction = action;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() {
  clearTimeout(toastTimer);
  toast.classList.remove('show');
  toastAction = null;
}
$('toastBtn').addEventListener('click', () => {
  const action = toastAction;
  hideToast();
  action?.();
});

// Adding
$('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('nameInput').value.trim();
  const qty = $('qtyInput').value.trim();
  if (!name) { $('nameInput').focus(); return; }

  // Re-adding something already on the list re-activates it in its old spot
  // instead of creating a duplicate.
  flushRender();
  let item = items.find((it) => sameName(it.name, name));
  const isNew = !item;
  if (item) {
    item.done = false;
    if (qty) item.qty = qty;
  } else {
    item = { id: uid(), name, qty, done: false };
    items.push(item);
  }
  save();
  render({ enter: isNew ? item.id : null });
  flash(item.id);

  $('nameInput').value = '';
  $('qtyInput').value = '';
  document.activeElement?.blur();
});

// Tap a row to tick / untick it; ✎ edits.
$('listMain').addEventListener('click', (e) => {
  if (Date.now() < suppressClickUntil) return; // the tail end of a drag
  const li = e.target.closest('li');
  const item = li && byId(li.dataset.id);
  if (!item) return;

  if (e.target.closest('.edit')) openEdit(item);
  else toggle(item);
});

const editDialog = $('editDialog');
let editing = null;

function openEdit(item) {
  editing = item;
  $('editName').value = item.name;
  $('editQty').value = item.qty;
  editDialog.returnValue = '';
  editDialog.showModal();
}

editDialog.addEventListener('close', () => {
  if (editDialog.returnValue === 'save' && editing) {
    editing.name = $('editName').value.trim() || editing.name;
    editing.qty = $('editQty').value.trim();
    save();
    render();
  }
  editing = null;
});

$('deleteBtn').addEventListener('click', () => {
  const item = editing;
  editDialog.close();
  if (item) removeItem(item);
});

// List menu (⋮ in the list screen)
const menuDialog = $('menuDialog');
$('menuBtn').addEventListener('click', () => {
  menuDialog.returnValue = '';
  menuDialog.showModal();
});

menuDialog.addEventListener('close', () => {
  if (menuDialog.returnValue === 'untickAll') {
    items.forEach((it) => { it.done = false; });
    save();
    render();
  }
});

// ---------- Import CSV ----------
// Format: one item per row, "Quantity,Item" (quantity may be empty).
// A header row, ";" or tab separators (Excel), and a single "Item" column also work.

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const count = (ch) => first.split(ch).length;
  const sep = [',', ';', '\t'].reduce((a, b) => (count(b) > count(a) ? b : a));

  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') field += c;
      else if (text[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (c === '"') {
      quoted = true;
    } else if (c === sep) {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else {
      field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function csvToItems(text) {
  const rows = parseCSV(text)
    .map((r) => r.map((c) => c.trim()))
    .filter((r) => r.some(Boolean));
  const isHeader = (r) => /^(qty|quantity|quantitat|cantidad)$/i.test(r[0]) || /^(item|name|nom|producte|producto)$/i.test(r[1] || '');
  if (rows.length && isHeader(rows[0])) rows.shift();

  const out = [];
  for (const r of rows) {
    const [qty, name] = r.length >= 2 ? [r[0], r[1]] : ['', r[0]];
    if (!name || out.some((it) => sameName(it.name, name))) continue;
    out.push({ id: uid(), name, qty, done: false });
  }
  return out;
}

function applyImport(newItems, mode) {
  if (mode === 'replace') {
    items = newItems;
  } else {
    for (const n of newItems) {
      const existing = items.find((it) => sameName(it.name, n.name));
      if (!existing) items.push(n);
      else if (n.qty) existing.qty = n.qty;
    }
  }
  save();
  render();
  window.scrollTo(0, 0);
}

const fileInput = $('fileInput');
const importDialog = $('importDialog');
let pendingImport = null;

$('importBtn').addEventListener('click', () => {
  menuDialog.close();
  fileInput.click();
});

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file || !current) return;
  const newItems = csvToItems(await file.text());
  if (!newItems.length) { alert('No items found in that file.'); return; }

  if (!items.length) { applyImport(newItems, 'replace'); return; }
  pendingImport = newItems;
  $('importCount').textContent = newItems.length;
  importDialog.returnValue = '';
  importDialog.showModal();
});

importDialog.addEventListener('close', () => {
  if (pendingImport && ['replace', 'add'].includes(importDialog.returnValue)) {
    applyImport(pendingImport, importDialog.returnValue);
  }
  pendingImport = null;
});

// ---------- Export CSV ----------
// Same "Quantity,Item" format the importer reads, in list order.

function toCSV() {
  const cell = (v) => (/[",;\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v);
  const lines = [['Quantity', 'Item'], ...items.map((it) => [it.qty, it.name])];
  return '﻿' + lines.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

$('exportBtn').addEventListener('click', () => {
  menuDialog.close();
  if (!current) return;
  const slug = current.name.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'list';
  const blob = new Blob([toCSV()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${slug}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
});

// ---------- Drag to reorder ----------
// Hold a row (or grab the ⠿ handle straight away) and drag it. The row lifts
// and follows the finger while the others slide aside to make room.

const LONG_PRESS_MS = 350;
let press = null;            // a finger resting on a row, waiting to become a drag
let drag = null;             // the drag in progress
let suppressClickUntil = 0;  // the click that follows a drag must not tick the item

function cancelPress() {
  if (!press) return;
  clearTimeout(press.timer);
  press.li.classList.remove('pressing');
  press = null;
}

$('listMain').addEventListener('pointerdown', (e) => {
  if (drag || press || e.button !== 0) return;
  const li = e.target.closest('li[data-id]');
  if (!li || e.target.closest('.edit')) return;

  if (e.target.closest('.handle')) {
    e.preventDefault();
    startDrag(li, e.clientY, e.pointerId);
    return;
  }
  press = {
    li, pointerId: e.pointerId, x: e.clientX, y: e.clientY,
    timer: setTimeout(() => {
      const p = press;
      press = null;
      p.li.classList.remove('pressing');
      startDrag(p.li, p.y, p.pointerId);
    }, LONG_PRESS_MS),
  };
  li.classList.add('pressing');
});

function startDrag(li, y, pointerId) {
  if (renderTimer) { // a re-sort is pending: do it first, then grab the fresh row
    const id = li.dataset.id;
    render({ animate: false });
    li = rowEl(id);
    if (!li) return;
  }
  const list = li.parentElement;
  const rows = [...list.children];
  const sy = window.scrollY;
  const geo = rows.map((el) => {
    const r = el.getBoundingClientRect();
    return { el, top: r.top + sy, h: r.height };
  });
  const last = geo[geo.length - 1];
  drag = {
    li, list, geo, pointerId,
    from: rows.indexOf(li), to: rows.indexOf(li),
    startY: y, y, startScroll: sy,
    minTop: geo[0].top, maxBottom: last.top + last.h,
  };
  try { li.setPointerCapture(pointerId); } catch { /* pointer already gone */ }
  list.classList.add('sorting');
  li.classList.add('dragging');
  navigator.vibrate?.(15);
  layoutDrag();
  drag.raf = requestAnimationFrame(dragFrame);
}

function layoutDrag() {
  const d = drag;
  const me = d.geo[d.from];
  let dy = d.y - d.startY + (window.scrollY - d.startScroll);
  dy = Math.max(d.minTop - me.top, Math.min(d.maxBottom - (me.top + me.h), dy));
  d.li.style.translate = `0 ${dy}px`;

  // The row lands after every other row whose middle is above its middle.
  const center = me.top + dy + me.h / 2;
  d.to = d.geo.filter((o, i) => i !== d.from && o.top + o.h / 2 < center).length;
  d.geo.forEach((o, i) => {
    if (i === d.from) return;
    let shift = 0;
    if (i < d.from && i >= d.to) shift = me.h;
    else if (i > d.from && i <= d.to) shift = -me.h;
    o.el.style.translate = shift ? `0 ${shift}px` : '';
  });
}

// Every frame: scroll when held near the top/bottom edge, then re-layout.
function dragFrame() {
  if (!drag) return;
  const topEdge = document.querySelector('#listView .top').getBoundingClientRect().bottom + 60;
  const bottomEdge = window.innerHeight - 60;
  if (drag.y < topEdge) window.scrollBy(0, -Math.ceil((topEdge - drag.y) / 5));
  else if (drag.y > bottomEdge) window.scrollBy(0, Math.ceil((drag.y - bottomEdge) / 5));
  layoutDrag();
  drag.raf = requestAnimationFrame(dragFrame);
}

document.addEventListener('pointermove', (e) => {
  if (press && e.pointerId === press.pointerId) {
    // Moved before the long-press fired: it's a scroll or swipe, not a drag.
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
    return;
  }
  if (!drag || e.pointerId !== drag.pointerId) return;
  drag.y = e.clientY;
  layoutDrag();
});

// Once a drag has started, stop the page from scrolling under the finger.
document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });

// No long-press menu / text selection on rows.
$('listMain').addEventListener('contextmenu', (e) => {
  if (e.target.closest('li[data-id]')) e.preventDefault();
});

function endDrag(e) {
  if (press && e.pointerId === press.pointerId) cancelPress();
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  cancelAnimationFrame(d.raf);
  suppressClickUntil = Date.now() + 400;

  // Glide the row into its new slot, then commit the order.
  let finalY = 0;
  if (d.to > d.from) for (let i = d.from + 1; i <= d.to; i++) finalY += d.geo[i].h;
  else for (let i = d.to; i < d.from; i++) finalY -= d.geo[i].h;
  d.li.classList.remove('dragging');
  d.li.classList.add('settling');
  d.li.style.translate = `0 ${finalY}px`;

  setTimeout(() => {
    d.list.classList.remove('sorting');
    if (d.to !== d.from) {
      // Put the new order of this section back into the same array slots this
      // section occupied, so items in the other section keep their positions.
      const ids = d.geo.map((o) => o.el.dataset.id);
      const [moved] = ids.splice(d.from, 1);
      ids.splice(d.to, 0, moved);
      const newOrder = ids.map(byId);
      const sectionDone = d.list === doneList;
      let k = 0;
      items = items.map((it) => (!!it.done === sectionDone ? newOrder[k++] : it));
      save();
    }
    render({ animate: false });
  }, 220);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// ---------- Misc ----------

// Tapping outside any popup closes it (same as Cancel/Close).
document.querySelectorAll('dialog').forEach((dlg) => {
  dlg.addEventListener('click', (e) => {
    if (e.target !== dlg) return; // a click inside the content
    const r = dlg.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) dlg.close();
  });
});

// Keep several open tabs in sync.
window.addEventListener('storage', (e) => {
  if (e.key === KEY) { data = load(); route(); }
});

// Offline support. The app opens from the copy saved on the phone; sw.js fetches
// any new version in the background. Ask it whether one arrived, to offer a reload.
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').then((reg) => reg.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data === 'updated') showToast('New version available', 'Reload', () => location.reload());
  });
  navigator.serviceWorker.controller?.postMessage('check');
}

route();
</script>
